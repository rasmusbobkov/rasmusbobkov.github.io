name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # The docs gate in `pretest` verifies that each generated docs block's
      # recorded source head is an ancestor of HEAD, so the checkout needs the
      # history the default single-commit fetch omits.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The build runs before the tests so the built-output scans have a dist/
      # to read: the privacy scan looks for remote URLs and network APIs in
      # what ships, and the licence scan reads the real footer HTML that
      # carries the AGPL-3.0 source offer and the credits.
      - run: npm run build
      - run: npm test
      - run: npm run check
