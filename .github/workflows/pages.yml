name: Pages

# Publishes the built page to the address in astro.config.mjs (`site` + `base`),
# which is the address the footer's source offer is read at. CI is the gate
# that must pass before a change reaches `main`; this workflow only builds the
# same static output and hands it to Pages, so a page can never be served from
# a tree the gate rejected.
on:
  push:
    branches: [main]
  # Once a day, the refresh below reads the counter's public counts and the
  # build bakes them into the measurement page, as decision 0009 records.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, oldest kept: a page that is already up stays up
# while a newer build runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Refresh the committed measurement snapshot from the counter's public
      # counts before the build. A counter that does not answer leaves the
      # committed snapshot as it is; the script says so and exits without
      # failing the deploy.
      - run: node scripts/refresh-metrics.mjs
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
